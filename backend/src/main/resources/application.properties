spring.application.name=resource-allocation

# Database
# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# CORS
cors.allowed-origins=*

# Capacity limit per employee (default 100%)
app.capacity.max-percent=100

# Logging
logging.level.com.talentallocation=INFO
logging.level.org.springframework.web=WARN
